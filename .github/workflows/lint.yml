name: Lint

on:
  push:
    branches: [main]
    paths:
      - "*.sh"
      - "kernel-postinst-hook"
      - "nvidia-dkms-apt-hook"
      - "tests/**"
      - ".shellcheckrc"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "*.sh"
      - "kernel-postinst-hook"
      - "nvidia-dkms-apt-hook"
      - "tests/**"
      - ".shellcheckrc"
      - ".github/workflows/lint.yml"

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck (error severity)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          ignore_dirs: graphify-out

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: "3.8.0"

      - name: Check formatting (shfmt -i 2)
        run: shfmt -d -i 2 *.sh tests/*.sh kernel-postinst-hook nvidia-dkms-apt-hook
