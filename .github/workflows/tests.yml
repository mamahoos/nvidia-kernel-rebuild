name: Tests

on:
  push:
    branches: [main]
    paths:
      - "*.sh"
      - "kernel-postinst-hook"
      - "nvidia-dkms-apt-hook"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "*.sh"
      - "kernel-postinst-hook"
      - "nvidia-dkms-apt-hook"
      - "tests/**"
      - ".github/workflows/tests.yml"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-hook-tests:
    name: Unit + hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: ./tests/run_tests.sh
